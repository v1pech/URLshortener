#version: '3.8'

services:
  app:
    image: app
    build:
      context: ./src
    ports:
      - "8080:80"
    environment:
      - POSTGRES_URL=postgres://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}?sslmode=disable
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - LOG_LEVEL=${LOG_LEVEL}
      - URLSHORTENER_PASSWORD=${URLSHORTENER_PASSWORD}
      - URLSHORTENER_USER=${URLSHORTENER_USER}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_USER=${DB_USER}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 5s
    volumes:
      - db_data:/var/lib/postgresql

volumes:
  db_data: